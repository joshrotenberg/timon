name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@v2
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Plugin skills match the binary
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --quiet -- plugin build --check plugin

  msrv:
    name: MSRV check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          # Keep in step with rust-version in Cargo.toml.
          toolchain: "1.90.0"
      - uses: swatinem/rust-cache@v2
        with:
          shared-key: "msrv"
      - name: Check MSRV
        run: cargo check --all-targets

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Build docs
        run: cargo doc --no-deps

  book:
    name: Book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      # timon book is this repository's own task, so the checkout is trusted in a throwaway
      # state directory first. The commands reference describes the timon just built.
      - name: Build the book
        env:
          TIMON_HOME: ${{ runner.temp }}/timon
        run: |
          cargo build --quiet
          target/debug/timon trust
          target/debug/timon book --bin target/debug/timon
      # Pages deploys only once it is turned on: gh variable set PAGES_ENABLED --body true
      - name: Upload the site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/book/html

  pages:
    name: Deploy the book
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: book
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
