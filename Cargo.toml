[package]
# Installed from source; not published.
publish = false
name = "timon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A self-contained agent harness: one binary embedding Lua and Fennel over agent, session and tool APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/timon"
readme = "README.md"
keywords = ["claude", "codex", "lua", "agents", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "timon"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
claude-wrapper = "=0.14.4"
codex-wrapper = "=0.4.4"
glob = "0.3.4"
include_dir = "0.7.4"
jpx-core = "0.3.1"
memchr = "2.8.3"
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored", "async", "serde"] }
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
hex = "0.4.3"
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "signal", "sync"] }
zstd = "0.14.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
