[package]
# Installed from source; not published.
publish = false
name = "timon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A self-contained agent harness: one binary embedding Lua and Fennel over agent, session and tool APIs"
license = "MIT OR Apache-2.0"
repository = "https://github.com/joshrotenberg/timon"
readme = "README.md"
keywords = ["claude", "codex", "lua", "agents", "mcp"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "timon"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
mlua = { version = "=0.12.2", default-features = false, features = ["lua54", "vendored", "async", "serde"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["rt", "macros", "time", "signal", "sync"] }

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = "thin"
strip = true
